    const open = this.state.open || {};

      isOpen: !!open[it.id],

      { id: 'p1', pending: true, title: 'Plan vélo, tranche 1 : réunion publique reportée', text: "Le département demande de revoir le tracé rue de la République. La réunion publique passe du 22 octobre au 12 novembre ; Thomas Roux pilote la reprise du tracé. Projet en retard, 25 % d'avancement.", source: 'copil du 13/10, point 2', excerpt: "Le département demande à revoir le tracé de la rue de la République. La réunion publique prévue le 22/10 est reportée au 12/11. T. Roux pilote la reprise du tracé avec le département." }

    const temps = [
      { title: 'Cours oasis', text: "palette d'essences validée, 60 % d'avancement", source: 'copil du 06/10' },
      { title: 'École Pasteur', text: 'études en cours, 10 % d’avancement', source: 'portefeuille projets' },
      { title: 'Budget participatif 2026', text: 'terminé, 96 % du budget engagé', source: 'portefeuille projets' }
    ];
    return {
      arbitrer, attention, temps,
      printNote: () => window.print(),
      statusLabel: relue ? 'Relue, prête à envoyer' : 'Brouillon · DGS',
      statusStyle: relue

        : 'font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #fbe89a; color: #5a3f00;',
      readLabel: relue ? 'Relue ✓' : 'Marquer comme relue',
      markRead: () => this.setState({ relue: !relue }),
      sendDisabled: !relue,
      sendStyle: relue

    };
  }
}
