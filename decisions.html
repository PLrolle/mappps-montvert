      pendingCount: pending.length,
      doneCount: done.length,
      tabTodo: s.tab === 'todo',
      tabDone: s.tab === 'done',
      todoStyle: s.tab === 'todo' ? on : off,
      doneStyle: s.tab === 'done' ? on : off,
      showTodo: () => this.setState({ tab: 'todo' }),
      showDone: () => this.setState({ tab: 'done' })
    };
  }
